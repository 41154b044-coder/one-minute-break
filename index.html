<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ed"><title>一分鐘微休息</title><style>
:root{--ink:#203b36;--paper:#f7f4ed;--sage:#dbe6d9;--orange:#d86b45;--muted:#63716b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}.mark{font-weight:750;letter-spacing:.06em}.intro{margin:68px 0 34px}.eyebrow{color:var(--orange);font-weight:700;font-size:14px;letter-spacing:.12em}.intro h1{font-size:clamp(40px,8vw,76px);line-height:1.05;letter-spacing:-.06em;margin:12px 0}.intro p{font-size:18px;line-height:1.7;color:var(--muted);max-width:540px}.question{font-size:22px;font-weight:650;margin:36px 0 18px}.choices{display:flex;flex-wrap:wrap;gap:12px}.choice{border:1px solid #c6d2c7;background:transparent;color:var(--ink);padding:14px 18px;border-radius:999px;font:inherit;cursor:pointer}.choice[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible{outline:3px solid var(--orange);outline-offset:4px}.result{margin-top:28px;background:var(--sage);padding:26px 30px;border-radius:24px;min-height:150px}.result h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 12px;color:var(--muted)}.result p{font-size:24px;line-height:1.5;margin:0}.actions{display:flex;gap:12px;margin-top:20px}.primary{background:var(--orange);color:white;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:transparent;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}footer{margin-top:56px;color:var(--muted);font-size:13px;line-height:1.6}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--orange)}@media(max-width:520px){.intro{margin-top:48px}.question{font-size:20px}.result p{font-size:20px}}
</style></head><body><main class="app"><header class="top"><span class="mark">一分鐘微休息</span><span>不必變得更有效率，先照顧當下</span></header><section class="intro"><div class="eyebrow">A TINY RESET</div><h1>現在的你，<br>需要哪種休息？</h1><p>選一個最接近的狀態。我會給你一個一分鐘內能開始的小點子。你不需要做得完美，只要停一下。</p></section><div class="question">此刻比較像哪一種？</div><div class="choices" role="group" aria-label="選擇當下狀態"><button class="choice" aria-pressed="false" data-type="tired">腦袋很累</button><button class="choice" aria-pressed="false" data-type="stuck">卡住了</button><button class="choice" aria-pressed="false" data-type="restless">坐不住</button><button class="choice" aria-pressed="false" data-type="overwhelmed">事情太多</button></div><section class="result" aria-live="polite"><h2>給你的一分鐘</h2><p id="idea">先選一種狀態，讓休息從一個小動作開始。</p><div class="actions"><button class="primary" id="start" hidden>開始一分鐘</button><button class="secondary" id="another" hidden>換一個點子</button><span class="timer" id="timer" aria-live="polite"></span></div></section><footer>這是一個微休息點子工具，不是醫療或心理諮商服務。研究顯示短休息可能小幅改善活力與疲勞，但對整體工作表現的效果尚不確定。你的休息不用證明任何事。</footer></main><script>
const ideas={tired:["把視線移到窗外或房間最遠處，慢慢看五個不同的形狀。","閉上眼睛，放鬆下巴和肩膀，做三次自然的深呼吸。","喝幾口水，感覺杯子的溫度，再慢慢放下。"],stuck:["離開座位，走到門口再回來。回來後只寫下下一個最小步驟。","用一句話說出你卡在哪裡，不急著解決它。","看一看桌面，選一樣東西整理好就停。"],restless:["站起來伸展手臂，向上伸展，再輕輕轉動肩膀。","走到附近最遠的一個角落，再慢慢走回來。","腳掌踩穩地面，左右交替抬腳跟十次。"],overwhelmed:["把腦中最吵的一件事寫在紙上，先不安排、不評價。","看著身邊一件物品，描述它的顏色、形狀和觸感。","把手機翻面一分鐘，只注意現在身體接觸椅子的地方。"]};let current='';const buttons=[...document.querySelectorAll('.choice')],idea=document.querySelector('#idea'),start=document.querySelector('#start'),another=document.querySelector('#another'),timer=document.querySelector('#timer');function pick(type){current=type;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===type)));const list=ideas[type];idea.textContent=list[Math.floor(Math.random()*list.length)];start.hidden=false;another.hidden=false;timer.textContent=''}buttons.forEach(b=>b.addEventListener('click',()=>pick(b.dataset.type)));another.addEventListener('click',()=>pick(current));let tick;start.addEventListener('click',()=>{clearInterval(tick);let s=60;start.disabled=true;timer.textContent='01:00';tick=setInterval(()=>{s--;timer.textContent=`00:${String(s).padStart(2,'0')}`;if(s<=0){clearInterval(tick);timer.textContent='完成了，謝謝你停下來。';start.disabled=false}},1000)});
</script></body></html>
